name: Notion Manager

on:
  schedule:
    - cron: "0 11 * * 1-5" # Segunda a sexta às 08:00 BRT (UTC-3)
  workflow_dispatch: # Permite disparo manual pela interface do GitHub

jobs:
  executar:
    name: Executar Notion Manager
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4.2.2

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: "10.0.x"

      - name: Restaurar dependências
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Executar
        run: dotnet run --project src/NotionManagerNet/NotionManagerNet.csproj --configuration Release --no-build
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
